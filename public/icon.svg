<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pokeGradient" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1C1C"/>
      <stop offset="100%" stop-color="#CA0000"/>
    </linearGradient>
  </defs>
  <!-- Full Circle Background -->
  <circle cx="32" cy="32" r="28" fill="white" stroke="#2D2D2D" stroke-width="4"/>
  <!-- Top Red Half -->
  <path d="M4 32 A28 28 0 0 1 60 32" fill="url(#pokeGradient)" stroke="#2D2D2D" stroke-width="4"/>
  <!-- Middle Separator -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#2D2D2D" stroke-width="4"/>
  <!-- Center Button Rings -->
  <circle cx="32" cy="32" r="10" fill="white" stroke="#2D2D2D" stroke-width="4"/>
  <circle cx="32" cy="32" r="5" fill="white" stroke="#2D2D2D" stroke-width="1"/>
</svg>
