<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Background -->
  <rect width="1200" height="630" fill="#050505"/>
  
  <!-- Gradient Mesh Blurs -->
  <circle cx="200" cy="100" r="400" fill="url(#paint0_radial)" fill-opacity="0.15"/>
  <circle cx="1000" cy="530" r="400" fill="url(#paint1_radial)" fill-opacity="0.15"/>
  
  <!-- Subtle Grid System -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Central Glow -->
  <circle cx="600" cy="315" r="250" fill="#3B82F6" fill-opacity="0.05" filter="url(#blur)"/>
  
  <!-- Glassmorphism Card Frame -->
  <rect x="300" y="200" width="600" height="230" rx="40" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.1"/>
  <rect x="300" y="200" width="600" height="230" rx="40" stroke="url(#paint2_linear)" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Branding Body -->
  <g filter="url(#textShadow)">
    <text fill="white" fill-opacity="0.5" xml:space="preserve" style="white-space: pre" font-family="'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="0.6em" x="430" y="260">ULTRA PREMIUM</text>
    <text fill="url(#paint3_linear)" xml:space="preserve" style="white-space: pre" font-family="'Outfit', sans-serif" font-size="110" font-weight="bold" letter-spacing="-0.05em" x="330" y="360">ULTRADEX</text>
    <text fill="white" fill-opacity="0.3" xml:space="preserve" style="white-space: pre" font-family="'Inter', sans-serif" font-size="16" font-weight="500" letter-spacing="0.3em" x="400" y="405">EXPLORE THE GALAXY OF POKEMON</text>
  </g>

  <!-- Decorative Accents -->
  <circle cx="340" cy="240" r="10" fill="#3B82F6" fill-opacity="0.5"/>
  <circle cx="370" cy="240" r="10" fill="#EC4899" fill-opacity="0.3"/>
  <rect x="550" y="470" width="100" height="2" rx="1" fill="url(#paint2_linear)" fill-opacity="0.4"/>

  <defs>
    <filter id="blur" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="80" result="bgBlur"/>
    </filter>
    <filter id="textShadow" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="20" shadow-color="rgba(0,0,0,0.5)"/>
    </filter>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 100) rotate(90) scale(400)">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 530) rotate(90) scale(400)">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint2_linear" x1="300" y1="200" x2="900" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="paint3_linear" x1="330" y1="360" x2="870" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>
</svg>
